# n8n en un PC de casa, detras de una conexion domestica.
#
# POR QUE ESTE ARCHIVO Y NO EL DE oracle/
#
#   El compose de oracle/ usa Caddy para el HTTPS. Caddy pide el certificado a
#   Let's Encrypt, y para eso Let's Encrypt tiene que poder ENTRAR a tu maquina
#   por el puerto 80. En una conexion domestica chilena eso normalmente no se
#   puede: muchos proveedores usan CGNAT y no te dan IP publica propia, asi que
#   no hay puerto que abrir.
#
#   La solucion es Cloudflare Tunnel: en vez de que entren a tu casa, tu
#   maquina SALE hacia Cloudflare y mantiene la conexion abierta. Cloudflare
#   recibe el trafico de Telegram, lo cifra con su propio certificado y te lo
#   entrega por ese tunel. No abres ningun puerto en el router, no necesitas IP
#   fija y funciona igual detras de CGNAT.
#
#   Como el TLS lo termina Cloudflare, aca no hace falta Caddy.
#
# Con 16 GB de RAM esto usa alrededor de 1,5 GB. Sobra holgadamente.
#
#   docker compose up -d
#   docker compose logs -f

services:
  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    restart: unless-stopped

    environment:
      - POSTGRES_DB=${POSTGRES_DB:-n8n}
      - POSTGRES_USER=${POSTGRES_USER:-n8n}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

    # Afinado para una maquina con RAM de sobra. Si algun dia mueves esto a un
    # equipo mas chico, baja shared_buffers a 256MB.
    command: >
      postgres
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c work_mem=32MB
      -c maintenance_work_mem=256MB

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}

      - GENERIC_TIMEZONE=America/Santiago
      - TZ=America/Santiago

      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}

      # El nodo "Chat autorizado?" lee esta variable como $env.BIBLIO_TELEGRAM_CHAT_ID
      - BIBLIO_TELEGRAM_CHAT_ID=${BIBLIO_TELEGRAM_CHAT_ID}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false

      # Correo para el polite pool de Crossref (opcional)
      - CROSSREF_MAILTO=${CROSSREF_MAILTO}

      # --- URL publica -------------------------------------------------------
      # De aqui sale la direccion que n8n declara como suya, y con ella arma la
      # URL de retorno de OAuth que le entrega a Google. Si apunta a un dominio
      # que todavia no existe, el "Sign in with Google" se va a una pagina rota.
      #
      # FASE LOCAL (mientras no tengas el tunel):
      #     N8N_URL_PUBLICA=http://localhost:5678
      #     N8N_HOST=localhost
      #     N8N_PROTOCOL=http
      #     N8N_PROXY_HOPS=0
      #
      # CON EL TUNEL YA ANDANDO:
      #     N8N_URL_PUBLICA=https://n8n.tudominio.me
      #     N8N_HOST=n8n.tudominio.me
      #     N8N_PROTOCOL=https
      #     N8N_PROXY_HOPS=1     (un salto: el conector de Cloudflare)
      #
      # Los valores por defecto son los de la fase local, para que n8n sirva
      # recien instalado sin tocar nada.
      - WEBHOOK_URL=${N8N_URL_PUBLICA:-http://localhost:5678}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_PROXY_HOPS=${N8N_PROXY_HOPS:-0}

      # El flujo descarga PDFs; a disco en vez de RAM.
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem

      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=2000
      - EXECUTIONS_DATA_SAVE_ON_SUCCESS=all
      - EXECUTIONS_DATA_SAVE_ON_ERROR=all

    volumes:
      - n8n_data:/home/node/.n8n

    # El "127.0.0.1:" de adelante es lo importante: publica el puerto SOLO en
    # el propio PC, no en la red local. Nadie mas en tu casa (ni un dispositivo
    # comprometido en tu WiFi) puede llegar a n8n por aca.
    #
    # Sirve para dos cosas:
    #   - trabajar antes de tener el dominio y el tunel andando;
    #   - entrar despues desde el notebook con un tunel SSH:
    #       ssh -L 5678:localhost:5678 usuario@<ip-local-del-pc>
    #     y abrir http://localhost:5678
    #
    # El acceso desde internet lo da el tunel de Cloudflare, no este puerto.
    ports:
      - "127.0.0.1:5678:5678"

  # Tunel con nombre: el definitivo, el que da una direccion estable.
  #
  #   docker compose --profile tunel up -d
  #
  # Va bajo perfil porque sin CLOUDFLARE_TUNNEL_TOKEN el contenedor arranca,
  # falla, y 'restart: unless-stopped' lo revive en bucle: gasta CPU y llena el
  # log de errores durante toda la fase previa al dominio, que son dias. Con el
  # perfil simplemente no existe hasta que lo pides.
  #
  # Una vez creado, los reinicios del PC lo vuelven a levantar solo: los
  # perfiles solo deciden que se crea con 'up', no que se reinicia despues.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: n8n-cloudflared
    restart: unless-stopped
    profiles: ["tunel"]

    depends_on:
      - n8n

    # Conexion saliente hacia Cloudflare. No escucha nada, no abre puertos.
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}

  # ---------------------------------------------------------------------------
  # Tunel rapido, para probar Telegram ANTES de tener el dominio.
  #
  #   docker compose --profile rapido up cloudflared-rapido
  #
  # Cloudflare provisiona un tunel temporal sin cuenta y sin dominio, y entrega
  # una direccion al azar del tipo
  #
  #     https://algo-random-aqui.trycloudflare.com
  #
  # con HTTPS valido, que es lo unico que Telegram exige para el webhook. La
  # direccion aparece en los logs de este contenedor, dentro de un recuadro.
  #
  # DOS COSAS QUE HAY QUE SABER:
  #
  #   - La direccion CAMBIA en cada arranque. Cada vez que lo levantas hay que
  #     actualizar N8N_URL_PUBLICA y N8N_HOST en el .env, recargar n8n y volver
  #     a publicar el workflow para que Telegram registre el webhook nuevo. Por
  #     eso esto es una prueba, no la instalacion definitiva.
  #
  #   - No lleva 'restart: unless-stopped' a proposito. Si se cae, la direccion
  #     que quedo en el .env deja de ser valida igual, asi que reiniciarlo solo
  #     no arreglaria nada y encima dejaria el tunel abierto sin que te enteres.
  #
  # El perfil "rapido" hace que NO arranque con un 'docker compose up -d'
  # normal: hay que pedirlo explicitamente.
  cloudflared-rapido:
    image: cloudflare/cloudflared:latest
    container_name: n8n-cloudflared-rapido
    profiles: ["rapido"]

    depends_on:
      - n8n

    # http://n8n:5678, no localhost: 'n8n' es el nombre del servicio en la red
    # interna de Docker. Con localhost el tunel se apuntaria a si mismo.
    command: tunnel --no-autoupdate --url http://n8n:5678

volumes:
  postgres_data:
  n8n_data:
